[project]
name = "tp-2"
version = "0.1.0"
description = "SIA - TP2: Algoritmos Genéticos"
readme = "README.md"
authors = [
    { name = "Lautaro Bonseñor", email = "lbonsenor@itba.edu.ar" },
    { name = "Juan Ignacio Causse", email = "jcausse@itba.edu.ar" },
    { name = "Augusto Andrés Lanari", email = "alanari@itba.edu.ar" },
    { name = "Javier Emmanuel Liu", email = "jaliu@itba.edu.ar" },
    { name = "Nicolás Rivas", email = "nrivas@itba.edu.ar" }
]
requires-python = ">=3.14"
dependencies = [
    "hsluv>=5.0.4",
    "matplotlib>=3.11.1",
    "numba>=0.67.0",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "plotly>=7.0.0",
    "scikit-image>=0.26.0",
]

[project.scripts]
tp-2 = "tp_2.__main__:main"

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "src"
module-name = "tp_2._tp_2_rust"

[dependency-groups]
dev = [
    "maturin>=1.15.0",
]
