# High-fidelity run: many triangles/pop for the best possible reconstruction
image_path = "./figures/brazil-flag.png"
output_path = "./output/sensitivity/high_triangles_quality.png"
num_triangles = 200
pop_size = 200
children_size = 140
crossover_prob = 0.8
mutation_prob = 0.05
survival_strategy = "additive"
parent_selection = "roulette"
survival_selection = "elite"
crossover = "two_point"
mutation = "multigene_uniform"
tournament_m = 3
tournament_threshold = 0.75
boltzmann_t0 = 100.0
boltzmann_tc = 10.0
boltzmann_k = 0.01
stop_criterion = "fitness"
max_generations = 3000
target_fitness = 0.97
stagnation_limit = 50
max_time_seconds = 300.0
