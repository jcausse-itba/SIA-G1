# Cheap/fast smoke test to validate the GA engine quickly (few triangles, small pop)
image_path = "./figures/brazil-flag.png"
output_path = "./output/sensitivity/low_triangles_quick.png"
num_triangles = 15
pop_size = 40
children_size = 20
crossover_prob = 0.8
mutation_prob = 0.05
survival_strategy = "additive"
parent_selection = "roulette"
survival_selection = "elite"
crossover = "two_point"
mutation = "multigene_uniform"
tournament_m = 3
tournament_threshold = 0.75
boltzmann_t0 = 100.0
boltzmann_tc = 10.0
boltzmann_k = 0.01
stop_criterion = "generations"
max_generations = 300
target_fitness = 0.99
stagnation_limit = 50
max_time_seconds = 300.0
