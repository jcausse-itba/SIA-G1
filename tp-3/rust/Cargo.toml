[package]
name = "rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_matmul"
crate-type = ["cdylib"]

[dependencies]
matrixmultiply = "0.3.11"
ndarray = "0.15"  # Use 0.15 for compatibility with numpy 0.29
numpy = "0.29.0"
pyo3 = { version = "0.29.2", features = ["extension-module"] }
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true