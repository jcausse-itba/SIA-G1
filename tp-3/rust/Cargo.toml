[package]
name = "rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_matmul"
crate-type = ["cdylib"]

[dependencies]
ndarray = { version = "0.15", features = ["rayon"] }
numpy = "0.22"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true