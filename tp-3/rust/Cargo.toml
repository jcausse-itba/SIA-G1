[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_matmul"
crate-type = ["cdylib"]

[dependencies]
matrixmultiply = "0.3.11"
ndarray = "0.17.2"
numpy = "0.29.0"
pyo3 = { version = "0.29.2", features = ["extension-module"] }
rand = "0.10.3"
rand_distr = "0.6.0"
rayon = "1.12.0"

[build]
rustflags = ["-C", "target-cpu=native"]