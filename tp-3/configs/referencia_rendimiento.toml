[data]
dataset_path = "./data and documentation/more_digits.csv"
test_dataset_path = "./data and documentation/more_digits.csv"
metrics_points = 0

[model]
model_type = "multilayer"
architecture = [784, 128, 64, 10]
activation = "relu"
beta = 1.0

[training]
learning_rate = 0.01
optimizer = "adam"
momentum_beta = 0.9

[generalization]
split_ratio = 0.85
k_folds = 10
threshold = 0.5

[stopping]
max_epochs = 1000

