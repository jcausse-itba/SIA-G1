[data]
dataset_path = "./data/more_digits.csv"
test_dataset_path = "./data/digits_test.csv"

[model]
model_type = "multilayer"
architecture = [784, 128, 64, 10] # Variante de arquitectura para mayor capacidad de aprendizaje
activation = "relu"
beta = 1.0

[training]
learning_rate = 0.01
optimizer = "adam"
momentum_beta = 0.9
batch_size = 64

[stopping]
max_epochs = 1000
target_error = 0.00001
target_accuracy = 0.98            # Criterio mínimo solicitado por la empresa (>=98%)

[generalization]
split_ratio = 0.85
k_folds = 10
threshold = 0.5

[persistence]
save_model_path = "./models/ej3_mlp_optimized.json"
load_model_path = ""