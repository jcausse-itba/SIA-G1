[project]
name = "tp-4"
version = "0.1.0"
description = "SIA TP4"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "commons",
    "ej1",
    "ej2",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
]

[tool.uv.workspace]
members = [
    "packages/ej1",
    "packages/ej2",
    "packages/commons",
]

[tool.uv.sources]
commons = { workspace = true }
ej1 = { workspace = true }
ej2 = { workspace = true }

[tool.uv]
package = false
