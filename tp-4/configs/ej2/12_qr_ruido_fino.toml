# Punto 2.1 - QR con niveles de ruido más finos cerca del límite de recuperación.
# uv run ej2 -c configs/ej2/12_qr_ruido_fino.toml

task = "qr"
output_dir = "output/ej2/qr/ruido_fino"

[patterns]
dataset_path = "data/hopfield"

[network]
update_mode = "asynchronous"
max_iterations = 100

[noise]
noise_levels = [0.1, 0.2, 0.3, 0.35, 0.4, 0.45, 0.5]
trials = 30
spurious_noise = 0.4
