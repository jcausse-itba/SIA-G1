# Punto 3 - Oja con learning rate bajo (convergencia lenta con el mismo número de épocas).
# uv run ej1 -c configs/ej1/oja/11_lr_bajo.toml

task = "oja"
output_dir = "output/ej1/oja/lr_bajo"

[data]
dataset_path = "data/creadores.csv"
exclude_features = ["price_ars", "organic_posts_pct", "total_engagement_per_1000", "estimated_argentina_reach"]  # derivadas exactas detectadas en el EDA

[oja]
oja_lr = 0.0001
oja_epochs = 500
