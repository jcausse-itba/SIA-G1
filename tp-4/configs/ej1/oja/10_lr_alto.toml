# Punto 3 - Oja con learning rate alto (riesgo de inestabilidad).
# uv run ej1 -c configs/ej1/oja/10_lr_alto.toml

task = "oja"
output_dir = "output/ej1/oja/lr_alto"

[data]
dataset_path = "datos/creadores.csv"
exclude_features = ["price_ars", "organic_posts_pct", "total_engagement_per_1000", "estimated_argentina_reach"]  # derivadas exactas detectadas en el EDA

[oja]
oja_lr = 0.01
oja_epochs = 500
