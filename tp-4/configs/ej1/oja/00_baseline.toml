# Punto 3 - Índice de Oja (config base) y comparación contra PC1.
# uv run ej1 -c configs/ej1/oja/00_baseline.toml

task = "oja"
output_dir = "output/ej1/oja/baseline"

[data]
dataset_path = "data/creadores.csv"
exclude_features = ["price_ars", "organic_posts_pct", "total_engagement_per_1000", "estimated_argentina_reach"]  # derivadas exactas detectadas en el EDA

[oja]
oja_lr = 0.001
oja_epochs = 500
