# Punto 1 - PCA con las variables seleccionadas (sin derivadas exactas).
# Biplot PC1/PC2 e interpretación de componentes.
# uv run ej1 -c configs/ej1/03_pca_seleccion.toml

task = "pca"
output_dir = "output/ej1/pca/seleccion"

[data]
dataset_path = "data/creadores.csv"
exclude_features = ["price_ars", "organic_posts_pct", "total_engagement_per_1000", "estimated_argentina_reach"]  # derivadas exactas detectadas en el EDA

[pca]
n_components = "none"  # completar con el valor justificado por el scree plot si se reduce
