# Punto 2 - Radio inicial grande (cubre toda la grilla 5x5).
# uv run ej1 -c configs/ej1/kohonen/31_radio_grande.toml

task = "kohonen"
output_dir = "output/ej1/kohonen/radio_grande"

[data]
dataset_path = "data/creadores.csv"
exclude_features = ["price_ars", "organic_posts_pct", "total_engagement_per_1000", "estimated_argentina_reach"]  # derivadas exactas detectadas en el EDA

[kohonen]
grid_rows = 5
grid_cols = 5
iterations = 5000
init_method = "sample"
initial_lr = 0.5
final_lr = 0.01
initial_radius = 5.0
final_radius = 1.0
n_runs = 10
