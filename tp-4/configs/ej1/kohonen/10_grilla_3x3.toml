# Punto 2 - Variación de grilla: chica (9 neuronas, pocos clusters).
# uv run ej1 -c configs/ej1/kohonen/10_grilla_3x3.toml

task = "kohonen"
output_dir = "output/ej1/kohonen/grilla_3x3"

[data]
dataset_path = "datos/creadores.csv"
exclude_features = ["price_ars", "organic_posts_pct", "total_engagement_per_1000", "estimated_argentina_reach"]  # derivadas exactas detectadas en el EDA

[kohonen]
grid_rows = 3
grid_cols = 3
iterations = 5000
init_method = "sample"
initial_lr = 0.5
final_lr = 0.01
initial_radius = "none"  # none = max(filas, columnas)/2
final_radius = 1.0
n_runs = 10
